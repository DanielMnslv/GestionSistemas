<script>
    /* Tema claro/oscuro: se fija antes de pintar para evitar el parpadeo (el botón vive en static/js/tema.js). */
    (function () {
        var t = null;
        try { t = localStorage.getItem("jano-tema"); } catch (e) {}
        if (t !== "dark" && t !== "light") {
            t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-tema", t);
    })();
</script>
